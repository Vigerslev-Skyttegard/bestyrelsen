name: Update parking data
run-name: Update parking data ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      payload:
        description: JSON data sent by the board administration page
        required: true
        type: string
      request_id:
        description: Unique identifier used by the administration page to track this save
        required: true
        type: string

concurrency:
  group: update-parking-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-data:
    name: Validate and update data.json
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - name: Validate incoming JSON and write the one permitted file
        env:
          PAYLOAD_JSON: ${{ inputs.payload }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path

          EXPECTED_ADDRESSES = json.loads('["Vigerslevvej 148, st.tv", "Vigerslevvej 148, st.mf", "Vigerslevvej 148, st.th", "Vigerslevvej 148, 1.tv", "Vigerslevvej 148, 1.mf", "Vigerslevvej 148, 1.th", "Vigerslevvej 148, 2.tv", "Vigerslevvej 148, 2.mf", "Vigerslevvej 148, 2.th", "Vigerslevvej 146, st.tv", "Vigerslevvej 146, st.th", "Vigerslevvej 146, 1.tv", "Vigerslevvej 146, 1.th", "Vigerslevvej 146, 2.tv", "Vigerslevvej 146, 2.th", "Vigerslevvej 144, st.tv", "Vigerslevvej 144, st.mf", "Vigerslevvej 144, st.th", "Vigerslevvej 144, 1.tv", "Vigerslevvej 144, 1.mf", "Vigerslevvej 144, 1.th", "Vigerslevvej 144, 2.tv", "Vigerslevvej 144, 2.mf", "Vigerslevvej 144, 2.th", "Skyttegaardvej 11, st.tv", "Skyttegaardvej 11, st.mf", "Skyttegaardvej 11, st.th", "Skyttegaardvej 11, 1.tv", "Skyttegaardvej 11, 1.mf", "Skyttegaardvej 11, 1.th", "Skyttegaardvej 11, 2.tv", "Skyttegaardvej 11, 2.mf", "Skyttegaardvej 11, 2.th", "Skyttegaardvej 9, st.tv", "Skyttegaardvej 9, st.th", "Skyttegaardvej 9, 1.tv", "Skyttegaardvej 9, 1.th", "Skyttegaardvej 9, 2.tv", "Skyttegaardvej 9, 2.th", "Skyttegaardvej 7, st.tv", "Skyttegaardvej 7, st.mf", "Skyttegaardvej 7, st.th", "Skyttegaardvej 7, 1.tv", "Skyttegaardvej 7, 1.mf", "Skyttegaardvej 7, 1.th", "Skyttegaardvej 7, 2.tv", "Skyttegaardvej 7, 2.mf", "Skyttegaardvej 7, 2.th", "Skyttegaardvej 5, st.tv", "Skyttegaardvej 5, st.mf", "Skyttegaardvej 5, st.th", "Skyttegaardvej 5, 1.tv", "Skyttegaardvej 5, 1.mf", "Skyttegaardvej 5, 1.th", "Skyttegaardvej 5, 2.tv", "Skyttegaardvej 5, 2.mf", "Skyttegaardvej 5, 2.th", "Skyttegaardvej 3, st.tv", "Skyttegaardvej 3, st.th", "Skyttegaardvej 3, 1.tv", "Skyttegaardvej 3, 1.th", "Skyttegaardvej 3, 2.tv", "Skyttegaardvej 3, 2.th", "Skyttegaardvej 1, st.tv", "Skyttegaardvej 1, st.th", "Skyttegaardvej 1, 1.tv", "Skyttegaardvej 1, 1.th", "Skyttegaardvej 1, 2.tv", "Skyttegaardvej 1, 2.th"]')
          request_id = os.environ.get("REQUEST_ID", "")
          if not re.fullmatch(r"save-[A-Za-z0-9_-]{1,80}", request_id):
              raise SystemExit("Invalid request identifier.")

          raw = os.environ.get("PAYLOAD_JSON", "")
          if not raw or len(raw) > 60000:
              raise SystemExit("Payload is empty or exceeds the 60,000-character safety limit.")
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Invalid JSON payload: {exc}")

          if not isinstance(data, dict) or data.get("schemaVersion") != 1:
              raise SystemExit("Unsupported data format: schemaVersion must be 1.")
          if set(data.keys()) != {"schemaVersion", "updatedAt", "rows"}:
              raise SystemExit("Unexpected top-level properties in data payload.")

          updated_at = data.get("updatedAt")
          if not isinstance(updated_at, str):
              raise SystemExit("updatedAt must be an ISO timestamp.")
          try:
              datetime.fromisoformat(updated_at.replace("Z", "+00:00"))
          except ValueError:
              raise SystemExit("updatedAt is not a valid ISO timestamp.")

          rows = data.get("rows")
          if not isinstance(rows, list) or len(rows) != len(EXPECTED_ADDRESSES):
              raise SystemExit(f"rows must contain exactly {len(EXPECTED_ADDRESSES)} fixed addresses.")

          clean_rows = []
          seen_ids = set()
          seen_addresses = set()
          for index, row in enumerate(rows, start=1):
              if not isinstance(row, dict) or set(row.keys()) != {"id", "address", "car", "motorcycle"}:
                  raise SystemExit(f"Row {index} has missing or unexpected fields.")
              row_id = row["id"]
              if not isinstance(row_id, str) or not re.fullmatch(r"[A-Za-z0-9_-]{1,80}", row_id):
                  raise SystemExit(f"Row {index} has an invalid id.")
              if row_id in seen_ids:
                  raise SystemExit(f"Duplicate row id: {row_id}")
              seen_ids.add(row_id)

              address = row["address"]
              if not isinstance(address, str) or address != EXPECTED_ADDRESSES[index - 1]:
                  raise SystemExit(f"Row {index} must be the fixed address {EXPECTED_ADDRESSES[index - 1]}.")
              if address in seen_addresses:
                  raise SystemExit(f"Duplicate address: {address}")
              seen_addresses.add(address)

              clean = {"id": row_id, "address": address}
              for key in ("car", "motorcycle"):
                  value = row[key]
                  if not isinstance(value, str):
                      raise SystemExit(f"Row {index}: {key} must be text.")
                  value = value.strip()
                  if len(value) > 80:
                      raise SystemExit(f"Row {index}: {key} is longer than 80 characters.")
                  if any(ord(char) < 32 and char not in "\t" for char in value):
                      raise SystemExit(f"Row {index}: {key} contains a control character.")
                  if value:
                      is_date = re.fullmatch(r"\d{2}/\d{2}/\d{4}", value) is not None
                      is_plate = re.fullmatch(r"[A-ZÆØÅ]{2}\s?-?\s?\d{5}", value, re.IGNORECASE) is not None
                      if not (is_date or is_plate):
                          raise SystemExit(f"Row {index}: {key} must be blank, a date in DD/MM/YYYY format, or a Danish registration number.")
                      if is_date:
                          try:
                              datetime.strptime(value, "%d/%m/%Y")
                          except ValueError:
                              raise SystemExit(f"Row {index}: {key} contains an invalid date.")
                  clean[key] = value
              clean_rows.append(clean)

          normalized = {"schemaVersion": 1, "updatedAt": updated_at, "rows": clean_rows}
          destination = Path("parkering/data.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          temporary = Path("parkering/data.json.tmp")
          temporary.write_text(json.dumps(normalized, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          temporary.replace(destination)
          print(f"Validated {len(clean_rows)} fixed addresses. Only {destination} is written.")
          PY

      - name: Commit only parkering/data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- parkering/data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update parking data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
